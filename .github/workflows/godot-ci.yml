name: Godot CI

# PR-only validation; deliberately no push, schedule or deployment triggers.
on:
  pull_request:
    branches: [main, feat/passive-vfx-lab-v1, review/six-to-seven-gameplay-v1, fix/m0-hud-hero-quit-feedback, art/m0-final-button-components, fix/m0-navigation-ui-recovery, perf/m0-mobile-frame-pacing, codex/no-u-counter-pulse, experiment/no-u-reverse-impact-v2]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  godot-validation:
    name: godot-validation
    # Keep this isolated art review unmergeable as a draft while running the full checks.
    # Other drafts retain the existing runner-saving behavior.
    if: ${{ !github.event.pull_request.draft || github.head_ref == 'build/vendor-approved-art' || github.head_ref == 'review/clean-cut-corrections-godot' || github.head_ref == 'recovery/full-visual-gameplay' || github.head_ref == 'review/hero-clash-phase01' || github.head_ref == 'review/hero-clash-ui-polish-m0' || github.head_ref == 'fix/m0-hud-hero-quit-feedback' || github.head_ref == 'art/m0-final-button-components' || github.head_ref == 'fix/m0-navigation-ui-recovery' || github.head_ref == 'ui/hero-clash-gameplay-hud-v2' || github.head_ref == 'perf/m0-mobile-frame-pacing' || github.head_ref == 'ui/desktop-compact-hud' || github.head_ref == 'ui/edge-anchored-gameplay-hud' || github.head_ref == 'ui/m0-screen-cohesion' || github.head_ref == 'ui/m0-combat-readability' || github.head_ref == 'fix/m0-threat-indicator-recovery' || (((github.head_ref == 'review/six-to-seven-gameplay-v1' && github.base_ref == 'feat/passive-vfx-lab-v1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.head_ref == 'review/six-to-seven-neon-impact-v3' && github.base_ref == 'review/six-to-seven-gameplay-v1' && github.event.pull_request.head.repo.full_name == github.repository))) || ((github.head_ref == 'codex/no-u-counter-pulse' && github.base_ref == 'main' || github.head_ref == 'experiment/no-u-reverse-impact-v2' && github.base_ref == 'codex/no-u-counter-pulse' || github.head_ref == 'experiment/no-u-reverse-impact-v3' && github.base_ref == 'experiment/no-u-reverse-impact-v2') && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: ${{ (github.head_ref == 'integrate/no-u-v4-approved' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.head_ref == 'review/six-to-seven-gameplay-v1' && github.base_ref == 'feat/passive-vfx-lab-v1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.head_ref == 'review/six-to-seven-neon-impact-v3' && github.base_ref == 'review/six-to-seven-gameplay-v1' && github.event.pull_request.head.repo.full_name == github.repository)) || ((github.head_ref == 'codex/no-u-counter-pulse' && github.base_ref == 'main' || github.head_ref == 'experiment/no-u-reverse-impact-v2' && github.base_ref == 'codex/no-u-counter-pulse' || github.head_ref == 'experiment/no-u-reverse-impact-v3' && github.base_ref == 'experiment/no-u-reverse-impact-v2') && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache: true

      - name: Check engine and canonical GDD
        shell: bash
        run: |
          godot --version
          test -s docs/GDD.md
          test -f project.godot

      - name: Verify local approved artwork (offline)
        shell: bash
        run: python3 scripts/sync_approved_assets.py

      - name: Checkout unchanged main control for approved-art parity
        if: ${{ (github.head_ref == 'integrate/no-u-v4-approved' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || github.head_ref == 'feat/approved-individual-hero-sheets-2026-11-14' || github.head_ref == 'art/full-approved-hero-atlases' || github.head_ref == 'release/neon-arcade-approved-20261115' || github.head_ref == 'feat/msg-factory-v4-1' || github.head_ref == 'fix/m0-combat-ux-recovery' || (((github.head_ref == 'review/six-to-seven-gameplay-v1' && github.base_ref == 'feat/passive-vfx-lab-v1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.head_ref == 'review/six-to-seven-neon-impact-v3' && github.base_ref == 'review/six-to-seven-gameplay-v1' && github.event.pull_request.head.repo.full_name == github.repository))) || (github.head_ref == 'release/six-to-seven-neon-impact-v3-20261125' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.head_ref == 'codex/no-u-counter-pulse' && github.base_ref == 'main' || github.head_ref == 'experiment/no-u-reverse-impact-v2' && github.base_ref == 'codex/no-u-counter-pulse' || github.head_ref == 'experiment/no-u-reverse-impact-v3' && github.base_ref == 'experiment/no-u-reverse-impact-v2') && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ (((github.head_ref == 'review/six-to-seven-gameplay-v1' && github.base_ref == 'feat/passive-vfx-lab-v1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.head_ref == 'review/six-to-seven-neon-impact-v3' && github.base_ref == 'review/six-to-seven-gameplay-v1' && github.event.pull_request.head.repo.full_name == github.repository))) && '34767716e1c9b5ecb6e7361e6aced6d13d052817' || github.event.pull_request.base.sha }}
          path: .ci-source-control/project
          fetch-depth: 1
          persist-credentials: false

      - name: Record same-runner unchanged-main simulation control
        if: ${{ (github.head_ref == 'integrate/no-u-v4-approved' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || github.head_ref == 'feat/approved-individual-hero-sheets-2026-11-14' || github.head_ref == 'art/full-approved-hero-atlases' || github.head_ref == 'release/neon-arcade-approved-20261115' || github.head_ref == 'feat/msg-factory-v4-1' || github.head_ref == 'fix/m0-combat-ux-recovery' || (((github.head_ref == 'review/six-to-seven-gameplay-v1' && github.base_ref == 'feat/passive-vfx-lab-v1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.head_ref == 'review/six-to-seven-neon-impact-v3' && github.base_ref == 'review/six-to-seven-gameplay-v1' && github.event.pull_request.head.repo.full_name == github.repository))) || (github.head_ref == 'release/six-to-seven-neon-impact-v3-20261125' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || ((github.head_ref == 'codex/no-u-counter-pulse' && github.base_ref == 'main' || github.head_ref == 'experiment/no-u-reverse-impact-v2' && github.base_ref == 'codex/no-u-counter-pulse' || github.head_ref == 'experiment/no-u-reverse-impact-v3' && github.base_ref == 'experiment/no-u-reverse-impact-v2') && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        run: |
          # Parent ignore prevents candidate import/export from seeing another
          # project; the control's own resource root remains unchanged.
          touch .ci-source-control/.gdignore
          control_engine=""
          for control_name in godot godot4; do
            if command -v "$control_name" >/dev/null 2>&1 && [[ "$("$control_name" --version)" =~ ^4\.7\.2\.stable(\.|$) ]]; then
              control_engine="$(command -v "$control_name")"
              break
            fi
          done
          test -n "$control_engine"
          control_log="$RUNNER_TEMP/approved-art-source-main.log"
          "$control_engine" --headless --path .ci-source-control/project --import 2>&1 | tee "$control_log"
          state_reference="$RUNNER_TEMP/approved-art-source-main-states.json"
          "$control_engine" --headless --path .ci-source-control/project --script res://tests/frame_pacing/state_trace.gd -- --record "$state_reference" 2>&1 | tee -a "$control_log"
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load|Failed to open' "$control_log"; then exit 1; fi
          test -s "$state_reference"
          echo "GODOT_BIN=$control_engine" >> "$GITHUB_ENV"
          echo "GODOT_STATE_REFERENCE=$state_reference" >> "$GITHUB_ENV"

      - name: Import, test and smoke-test project
        shell: bash
        run: bash scripts/validate.sh

      - name: Validate Six to Seven review integration
        if: ${{ ((github.head_ref == 'review/six-to-seven-gameplay-v1' && github.base_ref == 'feat/passive-vfx-lab-v1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.head_ref == 'review/six-to-seven-neon-impact-v3' && github.base_ref == 'review/six-to-seven-gameplay-v1' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        shell: bash
        run: |
          set -euo pipefail
          for suite in six_to_seven/test_integration passive_vfx_lab/test_lab passive_feedback/test_contract passive_feedback/test_parity passive_feedback/test_layout weapon_presence/test_contract weapon_presence/test_parity; do
            godot --headless --path . --script "res://tests/$suite.gd" 2>&1 | tee "$RUNNER_TEMP/six-to-seven-suite.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load|Failed to open' "$RUNNER_TEMP/six-to-seven-suite.log"; then exit 1; fi
          done
          godot --headless --path . --script res://tests/six_to_seven/test_integration.gd -- v3 2>&1 | tee "$RUNNER_TEMP/six-to-seven-v3.log"
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load|Failed to open' "$RUNNER_TEMP/six-to-seven-v3.log"; then exit 1; fi
          godot --headless --path . --export-pack Web "$RUNNER_TEMP/ordinary.pck"
          python3 tests/six_to_seven/review_export.py --verify "$RUNNER_TEMP/ordinary.pck"
          python3 tests/six_to_seven/review_export.py --stage "$RUNNER_TEMP/six-to-seven-review" --target web
          godot --headless --path "$RUNNER_TEMP/six-to-seven-review" --import
          godot --headless --path "$RUNNER_TEMP/six-to-seven-review" --export-pack Web "$RUNNER_TEMP/review.pck"
          python3 tests/six_to_seven/review_export.py --verify "$RUNNER_TEMP/review.pck" --review

      - name: Verify Counter-Pulse and release isolation
        if: ${{ ((github.head_ref == 'codex/no-u-counter-pulse' && github.base_ref == 'main' || github.head_ref == 'experiment/no-u-reverse-impact-v2' && github.base_ref == 'codex/no-u-counter-pulse' || github.head_ref == 'experiment/no-u-reverse-impact-v3' && github.base_ref == 'experiment/no-u-reverse-impact-v2') && github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tests/no_u/test_reverse_impact.gd ]]; then
          godot --headless --path . --script res://tests/no_u/test_reverse_impact.gd 2>&1 | tee "$RUNNER_TEMP/no-u-v2.log"
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load|Failed to open' "$RUNNER_TEMP/no-u-v2.log"; then exit 1; fi
          fi
          godot --headless --path . --script res://tests/no_u/test_counter_pulse.gd 2>&1 | tee "$RUNNER_TEMP/no-u.log"
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load|Failed to open' "$RUNNER_TEMP/no-u.log"; then exit 1; fi
          godot --headless --path . --export-pack Web "$RUNNER_TEMP/no-u-ordinary.pck"
          python3 tests/six_to_seven/review_export.py --verify "$RUNNER_TEMP/no-u-ordinary.pck"
          python3 tests/six_to_seven/review_export.py --no-u --target web --stage "$RUNNER_TEMP/no-u-review"
          godot --headless --path "$RUNNER_TEMP/no-u-review" --import
          godot --headless --path "$RUNNER_TEMP/no-u-review" --export-pack Web "$RUNNER_TEMP/no-u-review.pck"
          python3 tests/six_to_seven/review_export.py --no-u --verify "$RUNNER_TEMP/no-u-review.pck"

      - name: Verify approved No U production export
        if: ${{ github.head_ref == 'integrate/no-u-v4-approved' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-pack Web "$RUNNER_TEMP/no-u-production.pck"
          python3 tests/six_to_seven/review_export.py --verify "$RUNNER_TEMP/no-u-production.pck"

  hero-clash-hybrid-evidence:
    name: hero-clash-hybrid-evidence
    # Native screenshots are review artifacts only, never a production export.
    if: ${{ github.head_ref == 'review/hero-clash-phase01' }}
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Prepare native X11 software renderer
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          fi
          python3 scripts/sync_approved_assets.py
          godot --headless --path . --import

      - name: Capture actual Clash Hybrid Godot screens
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/hero-clash-hybrid"
          mkdir -p "$output"
          for dimensions in '1920 1080' '1600 900' '1280 720' '915 412' '844 390' '390 844'; do
            read -r width height <<< "$dimensions"
            xvfb-run -a -s '-screen 0 1920x1080x24' timeout 90s \
              godot --path . --audio-driver Dummy --rendering-driver opengl3 \
              --script res://tests/review_hero_clash/capture.gd -- \
              "$width" "$height" "$output" --candidate=c \
              2>&1 | tee "$output/capture-$width-$height.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load|Failed to open' "$output/capture-$width-$height.log"; then
              echo "Godot reported a capture error at $width x $height" >&2
              exit 1
            fi
            test -s "$output/c-menu-$width"\x"$height.png"
          done
          test -s "$output/c-ready-844x390.png"
          test -s "$output/c-choice-1280x720.png"
          test -s "$output/c-won-390x844.png"

      - name: Upload review screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hero-clash-hybrid-native-screenshots
          path: ${{ runner.temp }}/hero-clash-hybrid/
          if-no-files-found: error
          retention-days: 21
          compression-level: 1
  
  hero-clash-ui-evidence:
    name: hero-clash-ui-evidence
    # PR-only native screenshots; not a normal interactive Web/device playtest.
    if: ${{ github.head_ref == 'review/hero-clash-ui-polish-m0' }}
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Prepare native X11 renderer
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          fi
          python3 scripts/sync_approved_assets.py
          godot --headless --path . --import

      - name: Capture true Godot runtime UI at six resolutions
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/hero-clash-ui"
          mkdir -p "$output"
          for dimensions in '1920 1080' '1600 900' '1280 720' '915 412' '844 390' '390 844'; do
            read -r width height <<< "$dimensions"
            xvfb-run -a -s '-screen 0 1920x1080x24' timeout 90s \
              godot --path . --audio-driver Dummy --rendering-driver opengl3 \
              --script res://tests/capture_hero_clash_ui.gd -- \
              "$width" "$height" "$output" \
              2>&1 | tee "$output/capture-$width-$height.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load|Failed to open|(^|[[:space:]])ERROR:' "$output/capture-$width-$height.log"; then
              echo "Godot native capture errors at $width x $height" >&2
              exit 1
            fi
            test -s "$output/ui-menu-$width"\x"$height.png"
            test -s "$output/ui-ready-$width"\x"$height.png"
            test -s "$output/ui-choice-$width"\x"$height.png"
          done

      - name: Upload screenshots and measured UI report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hero-clash-ui-production-candidate
          path: ${{ runner.temp }}/hero-clash-ui/
          if-no-files-found: error
          retention-days: 21
          compression-level: 1

  m0-creator-feedback-evidence:
    name: m0-creator-feedback-evidence
    if: ${{ github.head_ref == 'fix/m0-hud-hero-quit-feedback' || github.head_ref == 'art/m0-final-button-components' || github.head_ref == 'fix/m0-navigation-ui-recovery' }}
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Import art for actual native capture
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          fi
          python3 scripts/sync_approved_assets.py
          godot --headless --path . --import

      - name: Capture real UI fixes across six resolutions
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/m0-ui-feedback"
          mkdir -p "$output"
          capture_script="res://tests/capture_m0_creator_feedback.gd"
          if [[ "$GITHUB_HEAD_REF" == "fix/m0-navigation-ui-recovery" ]]; then
            capture_script="res://tests/recovery_m01/capture.gd"
            godot --headless --path . --script res://tests/recovery_m01/test_layout.gd -- "$output/layout-audit.json"
          fi
          for dims in '1920 1080' '1600 900' '1280 720' '915 412' '844 390' '390 844'; do
            read -r width height <<< "$dims"
            xvfb-run -a -s '-screen 0 1920x1080x24' timeout 90s \
              godot --path . --audio-driver Dummy --rendering-driver opengl3 \
              --script "$capture_script" -- \
              "$width" "$height" "$output" 2>&1 | tee "$output/capture-$width-$height.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load|Failed to open|(^|[[:space:]])ERROR:' "$output/capture-$width-$height.log"; then
              echo "Native capture errors at $width x $height" >&2
              exit 1
            fi
            test -s "$output/m0-ready-$width"\x"$height.png"
            test -s "$output/m0-hero-menu-$width"\x"$height.png"
            test -s "$output/m0-confirm-exit-$width"\x"$height.png"
          done

      - name: Upload genuine native UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.head_ref == 'fix/m0-navigation-ui-recovery' && 'm0-navigation-ui-recovery-godot' || 'm0-creator-feedback-godot' }}
          path: ${{ runner.temp }}/m0-ui-feedback/
          if-no-files-found: error
          retention-days: 21
          compression-level: 1

  gameplay-hud-v2-evidence:
    name: gameplay-hud-v2-evidence
    if: ${{ github.head_ref == 'ui/hero-clash-gameplay-hud-v2' }}
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: true
      - name: Prepare native Compatibility rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          python3 scripts/sync_approved_assets.py
          godot --headless --path . --import
      - name: Capture actual six-viewport HUD state matrix
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/hud-v2"
          mkdir -p "$output"
          for dimensions in '1920 1080' '1600 900' '1280 720' '915 412' '844 390' '390 844'; do
            read -r width height <<< "$dimensions"
            xvfb-run -a -s '-screen 0 1920x1080x24' timeout 60s \
              godot --path . --audio-driver Dummy --rendering-driver opengl3 \
              --script res://tests/hud_v2/capture.gd -- "$width" "$height" "$output" \
              2>&1 | tee "$output/capture-$width-$height.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:|Failed to load|Failed to open' "$output/capture-$width-$height.log"; then exit 1; fi
            test -s "$output/start-$width"\x"$height.png"
            test -s "$output/ready-$width"\x"$height.png"
            test -s "$output/full-build-$width"\x"$height.png"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
