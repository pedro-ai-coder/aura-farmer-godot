name: Godot CI

# PR-only validation; deliberately no push, schedule or deployment triggers.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: godot-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  godot-validation:
    name: godot-validation
    # Keep this isolated art review unmergeable as a draft while running the full checks.
    # Other drafts retain the existing runner-saving behavior.
    if: ${{ !github.event.pull_request.draft || github.head_ref == 'review/clean-cut-corrections-godot' || github.head_ref == 'recovery/full-visual-gameplay' || github.head_ref == 'review/hero-clash-phase01' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Check engine and canonical GDD
        shell: bash
        run: |
          godot --version
          test -s docs/GDD.md
          test -f project.godot

      - name: Download and verify approved Phaser artwork
        shell: bash
        run: python3 scripts/sync_approved_assets.py

      - name: Import, test and smoke-test project
        shell: bash
        run: bash scripts/validate.sh

  hero-clash-hybrid-evidence:
    name: hero-clash-hybrid-evidence
    # Native screenshots are review artifacts only, never a production export.
    if: ${{ github.head_ref == 'review/hero-clash-phase01' }}
    needs: godot-validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Prepare native X11 software renderer
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
          fi
          python3 scripts/sync_approved_assets.py
          godot --headless --path . --import

      - name: Capture actual Clash Hybrid Godot screens
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/hero-clash-hybrid"
          mkdir -p "$output"
          for dimensions in '1920 1080' '1600 900' '1280 720' '915 412' '844 390' '390 844'; do
            read -r width height <<< "$dimensions"
            xvfb-run -a -s '-screen 0 1920x1080x24' timeout 90s \
              godot --path . --audio-driver Dummy --rendering-driver opengl3 \
              --script res://tests/review_hero_clash/capture.gd -- \
              "$width" "$height" "$output" --candidate=c \
              2>&1 | tee "$output/capture-$width-$height.log"
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load|Failed to open' "$output/capture-$width-$height.log"; then
              echo "Godot reported a capture error at $width x $height" >&2
              exit 1
            fi
            test -s "$output/c-menu-$width"\x"$height.png"
          done
          test -s "$output/c-ready-844x390.png"
          test -s "$output/c-choice-1280x720.png"
          test -s "$output/c-won-390x844.png"

      - name: Upload review screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hero-clash-hybrid-native-screenshots
          path: ${{ runner.temp }}/hero-clash-hybrid/
          if-no-files-found: error
          retention-days: 21
          compression-level: 1
